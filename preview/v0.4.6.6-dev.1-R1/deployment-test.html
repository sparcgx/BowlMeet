<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BowlMeet v0.4.6.6-dev.1-R1｜Navigation Swap Test</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#172033;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:18px;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eef1f5}.row:last-child{border-bottom:0}.status{font-weight:900}.ok{color:#14804a}.bad{color:#b42318}.btn{display:block;text-align:center;text-decoration:none;background:#172033;color:#fff;border-radius:12px;padding:13px 16px;font-weight:850;margin-top:10px}</style></head><body><main class="wrap"><section class="card"><h1>Navigation Swap R1</h1><p>本次總表與我的位置對調。</p></section><section class="card"><div class="row"><span>版本</span><span class="status" id="version">檢查中</span></div><div class="row"><span>手機 Dock：總表</span><span class="status" id="dock">檢查中</span></div><div class="row"><span>更多：我的成績</span><span class="status" id="more">檢查中</span></div><div class="row"><span>桌面：我的在總表前</span><span class="status" id="desktop">檢查中</span></div></section><a class="btn" href="./index.html?v=0466d1r1">開啟 R1 Preview</a></main><script>(async()=>{const set=(id,ok)=>{const e=document.getElementById(id);e.textContent=ok?'PASS':'FAIL';e.className='status '+(ok?'ok':'bad')};try{const html=await fetch('./index.html?integrity=0466d1r1',{cache:'no-store'}).then(r=>r.text());const tabs=html.slice(html.indexOf('<nav class="tabs"'),html.indexOf('</nav>',html.indexOf('<nav class="tabs"'))+6);const dock=html.slice(html.indexOf('<nav class="mobile-glass-dock"'),html.indexOf('</nav>',html.indexOf('<nav class="mobile-glass-dock"'))+6);const more=html.slice(html.indexOf('<section class="mobile-
