<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BowlMeet｜版本檢查</title><style>body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f7fa;color:#172033}main{max-width:640px;margin:40px auto;padding:24px;background:white;border-radius:20px}h1{font-size:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#164bbb}button{font:inherit;padding:10px 18px;border-radius:12px;border:1px solid #d8dfe8;background:#fff}</style></head><body><main><h1>BowlMeet 版本檢查</h1><p>只檢查部署檔案；不讀取、上傳或清除個人成績與儲存資料。</p><pre id="result" role="status">檢查中…</pre><button id="retry" type="button">重新檢查</button><p><a href="./index.html">返回 BowlMeet</a></p></main><script>
async function check(){const out=document.getElementById('result');try{const [ir,hr,sr]=await Promise.all(['release-identity.json','index.html','sw.js'].map(p=>fetch('./'+p,{cache:'no-store'})));if(!ir.ok||!hr.ok||!sr.ok)throw Error('部分部署檔案尚未可用');const identity=await ir.json(),html=await hr.text(),sw=await sr.text(),version=html.match(/const APP_VERSION='([^']+)'/)?.[1],ok=version===identity.version&&sw.includes(version);out.textContent=(ok?'版本一致':'版本不一致，請勿升版')+'\nApp: '+version+'\nChannel: '+identity.channel+'\nBase: '+identity.base_commit+'\n此檢查不代表實機、雲端或資料還原驗收通過。';}catch(e){out.textContent='檢查未完成：'+e.message;}}document.getElementById('retry').addEventListener('click',check);check();
</script></body></html>
