name: BowlMeet dev.2 data-safety recovery gate
on:
  push:
    branches: ['test/v0.4.7.4-dev.2-data-safety']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fault-injection:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify product delta is only dev.2 source
        run: |
          git diff --exit-code bfb3211094b5bffd98f2d404909bdedc109c2516 -- index.html assets sw.js manifest.webmanifest release-identity.json '*.sql'
          mkdir -p fi-results
          sha256sum index.html tools/test-data-safety-v0474.py > fi-results/SHA256.txt
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run native storage faults
        run: |
          set -o pipefail
          python tools/test-data-safety-v0474.py . fi-results --browser '${{ matrix.browser }}' 2>&1 | tee fi-results/run.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bowlmeet-dev2-data-safety-${{ matrix.browser }}
          path: fi-results/
          retention-days: 14
